[project]
name = "encheres-carbone"
version = "0.1.0"
description = "EU ETS primary auctions on EEX: supply, demand indicators, and whether auction cover predicts the next price moves."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.1",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "statsmodels>=0.14.4",
    "xlrd>=2.0.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eua_auctions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
